name: awesome-ui CI (test + typecheck)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Typecheck (React strict TS)
        run: npm run typecheck

      - name: Run regression tests
        run: npm test

      - name: Ledger consistency check (llms.txt)
        run: python3 -I tools/check_llms_ledger.py
        working-directory: .

      - name: Registry consistency check (taxonomy + components)
        run: python3 -I tools/check_registry.py
        working-directory: .

      - name: Retrieval quality gate (expected-recall fixtures)
        run: python3 -I tools/check_retrieval.py
        working-directory: .

      - name: Gallery coverage gate (registry ↔ page reachability + icon vocabulary)
        run: python3 -I tools/check_gallery_coverage.py
        working-directory: .

      - name: Generated-artifacts consistency (roster/embed/aliases/api vs registry)
        working-directory: .
        run: |
          python3 -I tools/gen_registry_aliases.py
          python3 -I tools/gen_registry_api.py
          python3 -I tools/gen_registry_embed.py
          python3 -I tools/gen_skill_roster.py
          git diff --exit-code -- registry/components.json index.html SKILL.md